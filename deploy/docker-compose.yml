services:

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-aak_agency_db}
      MYSQL_USER: ${MYSQL_USER:-aak_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - internal

  app:
    image: ${APP_IMAGE}:${APP_IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-aak_agency_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Colombo
      DB_USERNAME: ${MYSQL_USER:-aak_app}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      DDL_AUTO: ${DDL_AUTO:-validate}
      APP_ADMIN_USERNAME: ${APP_ADMIN_USERNAME:-admin}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD}
      APP_ADMIN_FULL_NAME: ${APP_ADMIN_FULL_NAME:-AAK Agency Owner}
    volumes:
      - uploads_data:/app/uploads
    networks:
      - internal
    expose:
      - "8080"

  frontend:
    image: ${FRONTEND_IMAGE:-992382529780.dkr.ecr.ap-southeast-1.amazonaws.com/aak-dev-frontend}:${FRONTEND_IMAGE_TAG:-latest}
    restart: unless-stopped
    networks:
      - internal
    expose:
      - "80"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - app
      - frontend
    ports:
      - "80:80"
      - "443:443"
    # Reload every 6h so a certificate renewed by the certbot service is picked up without a restart.
    command: >
      /bin/sh -c "while :; do sleep 6h; nginx -s reload; done & exec nginx -g 'daemon off;'"
    volumes:
      - ./nginx/aak-agency.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./certbot/www:/var/www/certbot:ro
    networks:
      - internal

  # Renews the Let's Encrypt certificate (first issuance happens in the deploy workflow).
  certbot:
    image: certbot/certbot:v5.9.0
    restart: unless-stopped
    entrypoint: /bin/sh
    command: >
      -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $${!}; done"
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/hooks:/hooks:ro
      # Writable here (read-only for nginx) so the deploy hook can publish renewed certs.
      - ./nginx/certs:/etc/nginx/certs
    networks:
      - internal

networks:
  internal:

volumes:
  mysql_data:
  uploads_data:

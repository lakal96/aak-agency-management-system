name: Deploy AAK dev

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-southeast-1
  ECR_REPOSITORY: aak-dev-app
  APP_DOMAIN: aakagency.work.gd
  DEPLOY_REPOSITORY: https://raw.githubusercontent.com/lakal96/aak-agency-management-system/main/deploy

# Only one deploy may touch the dev host at a time; a newer push waits for the running one.
concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout application
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build \
            --tag "$ECR_REGISTRY/${ECR_REPOSITORY}:${GITHUB_SHA}" \
            --tag "$ECR_REGISTRY/${ECR_REPOSITORY}:latest" .
          docker push "$ECR_REGISTRY/${ECR_REPOSITORY}:${GITHUB_SHA}"
          docker push "$ECR_REGISTRY/${ECR_REPOSITORY}:latest"

      - name: Find dev EC2 instance
        id: instance
        run: |
          instance_id=$(aws ec2 describe-instances \
            --filters 'Name=tag:Name,Values=aak-dev-app-host' 'Name=instance-state-name,Values=running' \
            --query 'Reservations[0].Instances[0].InstanceId' --output text)
          test "$instance_id" != "None"
          echo "instance_id=$instance_id" >> "$GITHUB_OUTPUT"

      - name: Deploy through SSM
        env:
          INSTANCE_ID: ${{ steps.instance.outputs.instance_id }}
          ACCOUNT_ID: ${{ steps.login-ecr.outputs.registry }}
          LETSENCRYPT_EMAIL: ${{ vars.LETSENCRYPT_EMAIL }}
        run: |
          registry="${ACCOUNT_ID%%/*}"
          # Let's Encrypt sends expiry warnings here; without it we register anonymously.
          if [ -n "$LETSENCRYPT_EMAIL" ]; then
            email_args="--email $LETSENCRYPT_EMAIL"
          else
            email_args="--register-unsafely-without-email"
          fi
          commands=$(cat <<EOF
          set -e
          mkdir -p /opt/aak-agency/nginx/certs
          # A small swap file is a safety net on this 2 GB host: without it a memory spike during a
          # deploy (two JVM-heavy containers briefly overlapping) is an instant out-of-memory kill.
          if [ ! -f /swapfile ] && ! swapon --show | grep -q .; then
            dd if=/dev/zero of=/swapfile bs=1M count=1024 status=none
            chmod 600 /swapfile
            mkswap /swapfile >/dev/null
            swapon /swapfile
            echo '/swapfile none swap sw 0 0' >> /etc/fstab
          fi
          if ! rpm -q docker >/dev/null 2>&1; then
            dnf install -y docker
          fi
          if ! rpm -q openssl >/dev/null 2>&1; then
            dnf install -y openssl
          fi
          systemctl enable --now docker
          mkdir -p /usr/local/lib/docker/cli-plugins
          if [ ! -x /usr/local/lib/docker/cli-plugins/docker-compose ]; then
            curl -fsSL https://github.com/docker/compose/releases/latest/download/docker-compose-linux-x86_64 \
              -o /usr/local/lib/docker/cli-plugins/docker-compose
            chmod +x /usr/local/lib/docker/cli-plugins/docker-compose
          fi
          curl -fsSL "$DEPLOY_REPOSITORY/docker-compose.yml" -o /opt/aak-agency/docker-compose.yml
          curl -fsSL "$DEPLOY_REPOSITORY/nginx/aak-agency.conf" -o /opt/aak-agency/nginx/aak-agency.conf
          mkdir -p /opt/aak-agency/certbot/www /opt/aak-agency/certbot/conf /opt/aak-agency/certbot/hooks
          curl -fsSL "$DEPLOY_REPOSITORY/certbot/deploy-hook.sh" -o /opt/aak-agency/certbot/hooks/deploy-hook.sh
          chmod +x /opt/aak-agency/certbot/hooks/deploy-hook.sh
          # Nightly backup + weekly restore test (systemd timers). The scripts only ever add backups to S3.
          mkdir -p /opt/aak-agency/backup /opt/aak-agency/backups
          for f in aak-backup.sh restore-test.sh; do
            curl -fsSL "$DEPLOY_REPOSITORY/backup/\$f" -o "/opt/aak-agency/backup/\$f"
            chmod 755 "/opt/aak-agency/backup/\$f"
          done
          for u in aak-backup.service aak-backup.timer aak-restore-test.service aak-restore-test.timer; do
            curl -fsSL "$DEPLOY_REPOSITORY/backup/\$u" -o "/etc/systemd/system/\$u"
          done
          systemctl daemon-reload
          systemctl enable --now aak-backup.timer aak-restore-test.timer
          if [ ! -f /opt/aak-agency/nginx/certs/cert.pem ]; then
            token=\$(curl -fsS -X PUT "http://169.254.169.254/latest/api/token" -H "X-aws-ec2-metadata-token-ttl-seconds: 60")
            public_ip=\$(curl -fsS -H "X-aws-ec2-metadata-token: \$token" http://169.254.169.254/latest/meta-data/public-ipv4 || echo "localhost")
            openssl req -x509 -nodes -days 825 -newkey rsa:2048 \
              -keyout /opt/aak-agency/nginx/certs/key.pem \
              -out /opt/aak-agency/nginx/certs/cert.pem \
              -subj "/CN=\$public_ip" \
              -addext "subjectAltName=IP:\$public_ip"
          fi
          # Random secret generator for values that must never be a published default.
          gen_secret() { openssl rand -base64 96 | tr -dc 'A-Za-z0-9' | head -c "\$1"; }
          if [ ! -f /opt/aak-agency/.env ]; then
            umask 077
            {
              echo "APP_IMAGE=REPLACE_WITH_ECR_IMAGE"
              echo "APP_IMAGE_TAG=latest"
              echo "FRONTEND_IMAGE_TAG=latest"
              echo "MYSQL_ROOT_PASSWORD=\$(gen_secret 32)"
              echo "MYSQL_DATABASE=aak_agency_db"
              echo "MYSQL_USER=aak_app"
              echo "MYSQL_PASSWORD=\$(gen_secret 32)"
              echo "DDL_AUTO=validate"
              echo "APP_ADMIN_USERNAME=admin"
              echo "APP_ADMIN_PASSWORD=\$(gen_secret 20)"
              echo "APP_ADMIN_FULL_NAME=AAK Agency Owner"
            } > /opt/aak-agency/.env
            umask 022
          fi
          # The JWT signing secret signs every login token. Hosts created before this existed have
          # none in .env, so the app silently used the default published in the repo - make one.
          if ! grep -q '^JWT_SECRET=' /opt/aak-agency/.env; then
            echo "JWT_SECRET=\$(gen_secret 64)" >> /opt/aak-agency/.env
          fi
          chmod 600 /opt/aak-agency/.env
          # Schema is Flyway-managed now - force validate on every deploy, in case an
          # older .env from before the Flyway migration still has DDL_AUTO=update.
          if grep -q '^DDL_AUTO=' /opt/aak-agency/.env; then
            sed -i 's/^DDL_AUTO=.*/DDL_AUTO=validate/' /opt/aak-agency/.env
          else
            echo 'DDL_AUTO=validate' >> /opt/aak-agency/.env
          fi
          sed -i "s#REPLACE_WITH_ECR_IMAGE#$registry/$ECR_REPOSITORY#" /opt/aak-agency/.env
          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$registry"
          docker compose -f /opt/aak-agency/docker-compose.yml pull app
          docker compose -f /opt/aak-agency/docker-compose.yml up -d --remove-orphans
          # nginx's config is a bind-mounted file, not part of the image - compose won't detect
          # content changes there, so force-recreate it on every deploy to pick up routing changes.
          docker compose -f /opt/aak-agency/docker-compose.yml up -d --force-recreate nginx
          # First-time Let's Encrypt issuance for $APP_DOMAIN. Rehearse against the staging CA first
          # (dry run, no rate-limit cost); only request the real certificate if that passes. A failure
          # here keeps the current certificate and never fails the deploy.
          if [ ! -d "/opt/aak-agency/certbot/conf/live/$APP_DOMAIN" ]; then
            certbot_run="docker compose -f /opt/aak-agency/docker-compose.yml run -T --rm --entrypoint certbot certbot"
            if \$certbot_run certonly --webroot -w /var/www/certbot -d $APP_DOMAIN $email_args --agree-tos --non-interactive --dry-run; then
              \$certbot_run certonly --webroot -w /var/www/certbot -d $APP_DOMAIN $email_args --agree-tos --non-interactive --deploy-hook /hooks/deploy-hook.sh \
                && docker compose -f /opt/aak-agency/docker-compose.yml exec -T nginx nginx -s reload \
                || echo "WARNING: Let's Encrypt issuance failed; keeping the existing certificate"
            else
              echo "WARNING: Let's Encrypt dry run failed (DNS, port 80, or rate limit); keeping the existing certificate"
            fi
          fi
          # Prevent the small root volume from filling up with stale image layers from past deploys.
          docker image prune -af
          EOF
          )
          parameters=$(jq -nc --arg commands "$commands" '{commands: [$commands]}')
          command_id=$(aws ssm send-command \
            --document-name AWS-RunShellScript \
            --targets "Key=instanceIds,Values=$INSTANCE_ID" \
            --parameters "$parameters" \
            --query 'Command.CommandId' --output text)
          aws ssm wait command-executed --command-id "$command_id" --instance-id "$INSTANCE_ID" || true
          result=$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID")
          printf '%s\n' "$result" | jq '{Status: .Status, Output: .StandardOutputContent, Error: .StandardErrorContent}'
          test "$(printf '%s\n' "$result" | jq -r .Status)" = "Success"

# Overrides src/main/resources/application.properties on the test classpath.
spring.datasource.url=jdbc:h2:mem:aak_test;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Tests use Hibernate to build the schema from entities directly; Flyway's MySQL
# migrations aren't meant to run against the H2 test database.
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# REST API config that would otherwise only come from src/main/resources/application.properties
# (test resources fully shadow it on the test classpath, they aren't merged).
app.jwt.secret=test-only-secret-not-used-outside-the-test-suite-32-bytes
app.jwt.access-token-minutes=15
app.jwt.refresh-token-days=7
app.cors.allowed-origins=http://localhost:5173
app.security.cookie-secure=false
